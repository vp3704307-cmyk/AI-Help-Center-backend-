
<style>
  * { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    scroll-padding-top: 16px;
  }

  body {
    margin: 0;
    font-family: Arial, "Noto Sans Devanagari", sans-serif;
    background: #f0fdfa;
    color: #173b39;
    line-height: 1.55;
  }

  header {
    background: #ffffff;
    padding: 18px 14px;
    text-align: center;
    border-bottom: 1px solid #d5e9e5;
  }

  header h1 {
    margin: 0;
    color: #0f766e;
    font-size: clamp(24px, 5vw, 32px);
  }

  header p { margin: 6px 0 0; }

  main {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    padding: 18px 14px;
  }

  .hero, .panel {
    background: #ffffff;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 18px;
    box-shadow: 0 4px 18px #0f766e0d;
    overflow-wrap: anywhere;
  }

  .hero { background: #ccfbf1; }

  h2 {
    font-size: clamp(20px, 4vw, 25px);
    line-height: 1.4;
    margin-top: 0;
  }

  .categories {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .category {
    min-width: 0;
    min-height: 94px;
    padding: 13px;
    background: #ffffff;
    color: #173b39;
    border: 1px solid #d5e9e5;
    border-radius: 12px;
    text-align: left;
    font: inherit;
    font-size: 14px;
    overflow-wrap: anywhere;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }

  .category strong {
    display: block;
    margin: 4px 0;
    font-size: 15px;
  }

  .category:hover, .category:focus-visible {
    border-color: #0f766e;
    background: #f0fdfa;
    outline: 2px solid #99f6e4;
    outline-offset: 1px;
  }

  .category:active { background: #ccfbf1; }

  label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
  }

  textarea {
    display: block;
    width: 100%;
    min-height: 115px;
    padding: 14px;
    border: 1px solid #9bbfba;
    border-radius: 12px;
    background: #ffffff;
    color: #173b39;
    font: inherit;
    font-size: 16px;
    resize: vertical;
  }

  textarea:focus-visible {
    outline: 2px solid #0f766e;
    outline-offset: 2px;
  }

  .submit-button {
    width: 100%;
    min-height: 50px;
    margin-top: 12px;
    padding: 13px 16px;
    border: 0;
    border-radius: 12px;
    background: #0f766e;
    color: #ffffff;
    font: inherit;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
  }

  .submit-button:focus-visible {
    outline: 3px solid #99f6e4;
    outline-offset: 2px;
  }

  button:disabled {
    opacity: .65;
    cursor: wait;
  }

  #answer {
    display: none;
    margin-top: 16px;
    padding: 15px;
    border-radius: 12px;
    background: #ecfdf5;
    border: 1px solid #a7d8c7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    scroll-margin-top: 16px;
  }

  .note {
    font-size: 14px;
    color: #496562;
  }

  footer {
    text-align: center;
    padding: 22px 14px;
    color: #496562;
    font-size: 14px;
  }

  a { color: #0f766e; }

  @media (max-width: 380px) {
    main { padding: 12px 10px; }

    .hero, .panel { padding: 15px; }

    .categories { gap: 8px; }

    .category {
      padding: 10px;
      font-size: 13px;
    }

    .category strong { font-size: 14px; }
  }

  @media (min-width: 650px) {
    .categories {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    main { padding: 24px 18px; }

    .hero, .panel { padding: 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      transition: none !important;
    }
  }
</style>
